[package]
name = "nillm"
version = "1.0.8"
description = "NiLLM Arena App"
authors = ["you"]
edition = "2024"

[lib]
name = "nillm"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-safe-area-insets-css = "0.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Smaller debug information reduces local linking work.
[profile.dev]
debug = 1

[profile.release]
strip = "debuginfo"
