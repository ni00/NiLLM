[package]
name = "nillm"
version = "1.1.1"
description = "NiLLM Arena App"
authors = ["you"]
edition = "2024"

[lib]
name = "nillm"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-safe-area-insets-css = "0.2"
tauri-plugin-http = "2.8.0"

[features]
# Embed frontend assets in production builds.
custom-protocol = ["tauri/custom-protocol"]

# Smaller debug information reduces local linking work.
[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
